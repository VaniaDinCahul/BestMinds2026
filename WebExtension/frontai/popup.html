<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI FactChecker</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      margin: 0;
      background-color: #18181b;
      color: #f4f4f5;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 8px 0;
      color: #ffffff;
    }
    p {
      font-size: 13px;
      color: #a1a1aa;
      margin: 0 0 16px 0;
      line-height: 1.4;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <h2>AI Assistant FactChecker</h2>
  <p>Asistent pentru verificarea veridicității știrilor și analizarea articolelor.</p>
  <button id="check-btn">Verifică pagina curentă</button>
</body>
</html>
